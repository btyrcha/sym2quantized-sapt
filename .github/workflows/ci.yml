name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: format (pre-commit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pre-commit run --all-files

  test:
    name: test (py3.8)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install --upgrade pip
      # setup.py is the single source of truth for dependencies; the `dev`
      # extra carries the tooling. The suite asserts exact SymPy LaTeX output,
      # so sympy is capped below 1.13 there (see setup.py).
      - run: pip install -e ".[dev]"
      - run: coverage run -m pytest tests/ --slow
      - run: coverage report

  lint:
    name: pylint (non-blocking)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pylint --rcfile=.pylintrc src/
